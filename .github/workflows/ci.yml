name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch scenario rot from upstream Kubernetes changes.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck comes from the upstream release, NOT apt: apt ships an older version that
      # is below bin/doctor.sh's 0.11.0 floor AND reports a different finding set, so an
      # apt-installed runner disagrees with a developer's machine about what "lint clean" is.
      - name: Install shellcheck, bats and yq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats xz-utils
          wget -qO- https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C /tmp shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 /tmp/shellcheck /usr/local/bin/shellcheck
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.49.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          shellcheck --version

      # doctor.bats runs bin/doctor.sh against this runner as if it were a workstation, so
      # the runner must satisfy the same floors: kind is not preinstalled, and the default
      # inotify instance limit is below what doctor.sh requires.
      - name: Satisfy the host-tooling floors doctor.sh checks
        run: |
          sudo wget -qO /usr/local/bin/kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          sudo chmod +x /usr/local/bin/kind
          sudo sysctl -w fs.inotify.max_user_instances=512
      - name: Lint and run offline unit tests
        run: |
          bats tests/lint.bats tests/guard.bats tests/cluster.bats \
               tests/scenario.bats tests/profiles-advanced.bats \
               tests/doctor.bats tests/preflight.bats tests/record.bats \
               tests/coverage.bats

  discover:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          json=$(find scenarios -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "scenarios=${json}" >> "$GITHUB_OUTPUT"

  scenario:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kind, kubectl and yq
        run: |
          sudo wget -qO /usr/local/bin/kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.49.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/kind /usr/local/bin/yq
          kind version

      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512
          sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Setup — provision the broken state
        run: bin/scenario.sh setup "${{ matrix.slug }}"
        env:
          LAB_MIN_DISK_GIB: 5

      - name: Verify must FAIL — proves the scenario is genuinely broken
        env:
          LAB_MIN_DISK_GIB: 5
        run: |
          if bin/scenario.sh verify "${{ matrix.slug }}"; then
            echo "::error::verify.sh passed on the broken state — the scenario is not actually broken"
            exit 1
          fi
          echo "verify correctly failed on the broken state"

      - name: Solve — apply the reference solution
        run: bin/scenario.sh solve "${{ matrix.slug }}"
        env:
          LAB_MIN_DISK_GIB: 5

      - name: Verify must PASS — proves the reference solution is correct
        run: bin/scenario.sh verify "${{ matrix.slug }}"
        env:
          LAB_MIN_DISK_GIB: 5

      - name: Diagnostics on failure
        if: failure()
        run: |
          # Read the profile from the scenario rather than assuming trio: a hardcoded
          # kubeconfig silently produces empty diagnostics for any other profile.
          profile=$(yq -r '.profile' "scenarios/${{ matrix.slug }}/meta.yaml")
          export KUBECONFIG=".work/kubeconfig-${profile}"
          kubectl --context "kind-${profile}" config get-contexts || true
          for ns in $(kubectl --context "kind-${profile}" get ns -o name 2>/dev/null | cut -d/ -f2); do
            kubectl --context "kind-${profile}" -n "$ns" get pods -o wide 2>/dev/null || true
          done
